# other than Shanghai and the representative track, 10 seeds, the car
# network's errors replayed by situation, through the whole pipeline):
# accuracy, the RMS lateral deviation from the reference run with the car
# network's (small_weak) errors on the estimate (gain 1); latency, its
# growth per 25 ms the estimate comes late from the cloud (least squares
